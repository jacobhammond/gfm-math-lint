name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff Linter & Formatter
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Run Mypy Type Checker
        run: uv run --locked mypy src tests --strict

      - name: Run Pre-commit Hooks
        run: uv run --no-sync pre-commit run --all-files

      - name: Self-check Markdown with gfm-math-lint
        run: uv run --locked gfm-math-lint check README.md CHANGELOG.md CONTRIBUTING.md docs/ .github/

      - name: Self-check Shell scripts with gfm-math-lint
        run: uv run --locked gfm-math-lint check-shell .github/

      - name: Verify package build and twine metadata
        run: |
          uv build
          uv run --locked twine check --strict dist/*

  matrix-test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: [lint]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with pytest
        run: uv run --locked pytest -m "not network"

  smoke-install:
    name: smoke-install
    needs: [matrix-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke test wheel in clean virtualenv
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/gfm-math-lint --version
          /tmp/smoke-venv/bin/gfm-math-lint check README.md

  test:
    name: test
    needs: [matrix-test, smoke-install]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix test runs and smoke test succeeded
        run: |
          if [ "${{ needs.matrix-test.result }}" != "success" ]; then
            echo "Matrix tests failed with status: ${{ needs.matrix-test.result }}"
            exit 1
          fi
          if [ "${{ needs.smoke-install.result }}" != "success" ]; then
            echo "Smoke install failed with status: ${{ needs.smoke-install.result }}"
            exit 1
          fi
          echo "All cross-platform tests and smoke install passed!"
