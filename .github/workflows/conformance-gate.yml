name: conformance-gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  conformance-crucible:
    name: Conformance Crucible Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Setup Node.js runtime for KaTeX oracle
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install KaTeX oracle engine
        run: npm install -g katex

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Execute Conformance Crucible 4-Stage Benchmark Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/reports
          uv run --locked python -m conformance.runner \
            --format text \
            --output build/reports/conformance-scorecard.txt || EXIT_CODE=$?

          cat build/reports/conformance-scorecard.txt

          # Publish scorecard to GitHub Actions Step Summary
          echo "## Conformance Crucible Scorecard" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat build/reports/conformance-scorecard.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Emit JSON machine-readable scorecard
          uv run --locked python -m conformance.runner \
            --format json \
            --output build/reports/conformance-scorecard.json || true

          # If running with strict release gating, enforce exit code
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${STRICT_GATE:-false}" = "true" ]; then
            exit ${EXIT_CODE:-0}
          fi

      - name: Upload Conformance Scorecard Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-scorecard
          path: build/reports/
          retention-days: 14
